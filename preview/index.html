<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Story Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="phone" id="phone" role="group" aria-roledescription="story" aria-label="Match story viewer">
      <!-- Segmented progress bars -->
      <div class="progress" id="progress" aria-hidden="true"></div>

      <!-- Top chrome: title + counter -->
      <header class="topbar">
        <span class="story-title" id="storyTitle"></span>
        <span class="counter" id="counter"></span>
      </header>

      <!-- The current page (announced to assistive tech on change) -->
      <main class="stage" id="stage" aria-live="polite" aria-atomic="true">
        <div class="loading" id="loading">Loading story…</div>
      </main>

      <!-- Visually-hidden status for screen readers -->
      <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

      <!-- Tap zones for prev/next -->
      <button type="button" class="tap tap-prev" id="tapPrev" aria-label="Previous page"></button>
      <button type="button" class="tap tap-next" id="tapNext" aria-label="Next page"></button>

      <!-- Bottom chrome: play/pause + hint -->
      <footer class="bottombar">
        <button type="button" class="ctrl" id="playPause" aria-label="Pause">❚❚</button>
        <span class="hint">Tap sides • ← → keys • Space to pause</span>
      </footer>
    </div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
